    <script>
      // Garde la proposition d'installation du navigateur (Android, ordinateur) pour la page « Installer ».
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__taskoInstall = event
        window.dispatchEvent(new Event('tasko-install-ready'))
      })
      window.addEventListener('appinstalled', function () {
        window.__taskoInstall = null
        window.dispatchEvent(new Event('tasko-install-ready'))
      })
